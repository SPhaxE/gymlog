<!doctype html>
<html lang="zh-CN" style="background: #0a0a0b">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="color-scheme" content="dark" />
    <title>慢牛 Milo</title>
    <!-- 图标在 Android 端由 Capacitor 资源提供；网页先不请求 favicon.ico，免得每页一条 404 -->
    <link rel="icon" href="data:," />
    <!-- 主题：首帧前套上上次用的主题（src/styles/theme.ts 记在 milo-theme-applied），浅色用户不会先闪一下深色 -->
    <script>try { var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('milo-theme-applied'); if (t === 'light' || t === 'dark') { document.documentElement.dataset.theme = t; if (t === 'light') document.documentElement.style.background = '#f2f0ea'; } } catch (e) {}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
